<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="stWfBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="stPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif; font-weight: 800; fill: #F8FAFC; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif; fill: #94A3B8; font-size: 11px; }
    .mono { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 11px; }
    .dash { stroke-dasharray: 8 6; animation: stFlow 1.5s linear infinite; }
    @keyframes stFlow {
      to { stroke-dashoffset: -28; }
    }
  </style>

  <rect width="1200" height="260" rx="16" fill="url(#stWfBg)" stroke="#334155" stroke-width="2"/>
  <text x="36" y="36" class="title" font-size="14.5">SENTIS REALTY CORE v2.0 · END-TO-END REAL ESTATE BROKERAGE SOP &amp; RBAC WORKFLOW (288 ITEMS)</text>
  <text x="940" y="36" class="mono" fill="#FDE68A">● 7 ROLES · 18 CATEGORIES</text>

  <line x1="280" y1="142" x2="335" y2="142" stroke="url(#stPipe)" stroke-width="3" class="dash"/>
  <line x1="575" y1="142" x2="630" y2="142" stroke="url(#stPipe)" stroke-width="3" class="dash"/>
  <line x1="870" y1="142" x2="925" y2="142" stroke="url(#stPipe)" stroke-width="3" class="dash"/>

  <!-- Step 1 -->
  <g transform="translate(36, 56)">
    <rect width="244" height="170" rx="12" fill="#0B0F17" stroke="#2563EB" stroke-width="2"/>
    <text x="16" y="28" class="mono" fill="#60A5FA">STEP 01 · 集客・案内・調査</text>
    <text x="16" y="54" class="title" font-size="14.5">反響受付・車両予約・物件調査</text>
    <text x="16" y="78" class="sub">• 顧客反響・追客・案内車両予約(02-9)</text>
    <text x="16" y="98" class="sub">• 役所調査・インフラ・権利関係調査</text>
    <text x="16" y="118" class="sub">• 犯収法 eKYC 本人確認・買付申込</text>
    <text x="16" y="148" class="mono" fill="#38BDF8">Role: 営業担当 / 調査担当</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(333, 56)">
    <rect width="244" height="170" rx="12" fill="#0B0F17" stroke="#F59E0B" stroke-width="2"/>
    <text x="16" y="28" class="mono" fill="#FBBF24">STEP 02 · 重説・契約締結</text>
    <text x="16" y="54" class="title" font-size="14.5">35条重説排期・37条契約作成</text>
    <text x="16" y="78" class="sub">• 08 重説日程直結・専任宅建士割当</text>
    <text x="16" y="98" class="sub">• 07-13 売買契約書・特約条項作成</text>
    <text x="16" y="118" class="sub">• 印紙税・手付金・仲介手数料試算</text>
    <text x="16" y="148" class="mono" fill="#FDE68A">Role: 専任宅建士 / 契約作成</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(630, 56)">
    <rect width="244" height="170" rx="12" fill="#0B0F17" stroke="#38BDF8" stroke-width="2"/>
    <text x="16" y="28" class="mono" fill="#38BDF8">STEP 03 · 融資・決済逆算</text>
    <text x="16" y="54" class="title" font-size="14.5">住宅ローン本審査・D-14~D-2</text>
    <text x="16" y="78" class="sub">• 銀行事前/本審査・金消契約連動</text>
    <text x="16" y="98" class="sub">• 司法書士登記照合・精算書確定</text>
    <text x="16" y="118" class="sub">• 担当者自査 ＋ 部長二重承認ゲート</text>
    <text x="16" y="148" class="mono" fill="#67E8F9">Role: 融資決済 / 部門長</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(925, 56)">
    <rect width="239" height="170" rx="12" fill="#0B0F17" stroke="#10B981" stroke-width="2"/>
    <text x="16" y="28" class="mono" fill="#34D399">STEP 04 · 引渡・49条帳簿・挨拶</text>
    <text x="16" y="54" class="title" font-size="14.5">残金決済・法定台帳・定期挨拶</text>
    <text x="16" y="78" class="sub">• 鍵引渡書・仲介報酬領収・源泉税</text>
    <text x="16" y="98" class="sub">• 宅建業法第49条 取引台帳永久保存</text>
    <text x="16" y="118" class="sub">• 03-17 季節・年次の定期お客様挨拶</text>
    <text x="16" y="148" class="mono" fill="#34D399">Role: 経理総務 / 代表取締役</text>
  </g>
</svg>
